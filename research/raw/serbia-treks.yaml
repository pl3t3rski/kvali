region: "Danube and Morava valleys to the Nišava gorge (Serbian section: about 780 km in 38 stages)"
one_liner: "A cultural long-distance walk from Vienna to Istanbul; in Serbia it follows the Danube to Belgrade, then the Morava valley and the Nišava gorge to Bulgaria."
