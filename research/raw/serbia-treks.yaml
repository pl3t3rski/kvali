id: e4-serbia
name: European long-distance path E4 – Serbia (Evropski pešački put E4)
countries: [RS]
region: Banat, Belgrade, Homolje, Đerdap, Timok and Stara Planina (eastern Serbia)
one_liner: "Flat Banat farmland to Belgrade, then the Homolje mountains, the Iron Gates and Stara Planina to the Bulgarian border; sparse waymarks and few hikers."
route:
  type: point-to-point
  start: Horgoš / Đala (Hungarian border)
  end: Dimitrovgrad / Gradina (Bulgarian border)
  osm_relation_id: 9928151
