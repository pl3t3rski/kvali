distance_km: 1506
total_ascent_m: 27852
typical_days: null
when:
  best_months: null
  open_season: null
sleeping:
  type: mixed
  booking_ahead: recommended
  notes: "Mountain huts, apartments, hostels and hotels. Many private rooms are only bookable by phone, often in Serbian; one hiker wild-camped a lot."
difficulty:
  level: 3
  reason: "Flat and easy in Vojvodina, but the eastern sections are rated 'demanding' (Veliko Gradište–Beljanica: 149.6 km, +6,565 m); some paths are overgrown."
logistics:
  getting_to_start: "Trains serve Subotica, Novi Sad and Niš; buses are the most reliable option but there is no central bus operator."
  leaving_from_end: "The E4 is not defined between Gradina and Sofia; the Sultans Trail can be followed from the border to Sofia instead."
  nearest_airports: [Belgrade Nikola Tesla (BEG), Niš (INI)]
flags:
  permit: free-registration
  permit_notes: "No trail permit. Foreigners must register their stay with the police within 24 h; one hiker found this impractical when camping in remote places. The final stage runs close to the Bulgarian border, where border police may stop walkers."
  waymarked: partial
  water_scarce: null
  exposed_or_via_ferrata: null
