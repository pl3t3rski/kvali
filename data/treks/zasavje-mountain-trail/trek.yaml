id: zasavje-mountain-trail
status: published
name: Zasavje Mountain Trail (Zasavska planinska pot)
countries:
  - SI
region: Posavje Hills (Zasavje)
one_liner: From the Bizeljsko wine hills across the Posavje Hills to Mt Kum, a medium regional stamp trail.
route:
  type: point-to-point
  start: Šekoranja restaurant, Bizeljsko
  end: Kum hut (Trbovlje)
  osm_relation_id: 15850899
  osm_section:
    from:
      - 46.0151
      - 15.6932
    via:
      - - 46.182
        - 15.0089
      - - 46.0522
        - 14.7102
    to:
      - 46.0876
      - 15.0724
distance_km: 200
typical_days:
  min: 7
  max: 12
when:
  best_months:
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
  open_season: Snow can lie on Bohor and Lisca into late April
sleeping:
  type: mixed
  booking_ahead: recommended
  notes: "Twelve mountain huts and village inns along the way. Huts can be closed: check opening days. Beds in Bizeljsko are few."
difficulty:
  level: 2
  reason: Easy paths over low wooded hills (up to 1,220 m on Kum), but 200 km with long days and faded waymarks in places
logistics:
  getting_to_start: Train from Ljubljana to Sevnica or Brežice, then bus to Bizeljsko. No buses to Bizeljsko at weekends, on public holidays or in school holidays.
  leaving_from_end: Walk down from Kum to Trbovlje or Hrastnik for trains. The trail also crosses the railway at Zidani Most, Jevnica and Litija.
  nearest_airports:
    - Ljubljana
    - Zagreb
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages. The optional stamp diary has 19 checkpoints.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: false
establishment_signals:
  - official status (regional trail of the Alpine Association of Slovenia)
trip_reports:
  - url: https://web.archive.org/web/20201016011537/https://sites.google.com/site/dolgepoti/po-zasavski-planinski-poti
    title: Po Zasavski planinski poti – 2014
    year_hiked: 2014
    summary: "Two walkers go from Kum to Bizeljsko over the May holidays in five days, sleeping at Litija, Zasavska Sveta gora, Šmohor, Lisca and an inn at Bizeljsko. They lose the way where blazes are missing and are soaked by a storm on the last day: 210 km and 8,856 m of climbing. In Slovenian"
  - url: https://www.hribi.net/trenutne_razmere/slo/zasavska_planinska_pot/25/9744
    title: Zasavska planinska pot (forum post, 3 May 2024)
    year_hiked: 2024
    summary: A solo walker starts at Bizeljsko in late April and sleeps in huts. Fresh snow from Bohor to Lisca and fog hide the faded blazes; she skips Veliko Kozje and changes the last stage to catch public transport. In Slovenian
