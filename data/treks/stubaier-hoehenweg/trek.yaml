  best_months:
    - 7
    - 8
    - 9
  open_season: The huts open in early to late June and close in late September
sleeping:
  type: huts
  booking_ahead: required
  notes: Eight Alpine Club huts; descent to the valley possible from every hut.
difficulty:
  level: 3
  reason: "A black (difficult) mountain trail: some sections secured with steel cables, and steep old snow early in the season"
logistics:
  getting_to_start: Bus 590 from Innsbruck main station to Neustift.
  leaving_from_end: Descend from the Innsbrucker Hütte through the Pinnistal to Neustift.
