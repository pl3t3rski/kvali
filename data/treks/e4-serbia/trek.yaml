id: e4-serbia
status: draft
name: European long-distance path E4 – Serbia (Evropski pešački put E4)
countries:
  - RS
region: Banat, Belgrade, Homolje, Đerdap, Timok and Stara Planina (eastern Serbia)
one_liner: Flat Banat farmland to Belgrade, then the Homolje mountains, the Iron Gates and Stara Planina to the Bulgarian border; sparse waymarks and few hikers.
route:
  type: point-to-point
  start: Horgoš / Đala (Hungarian border)
  end: Dimitrovgrad / Gradina (Bulgarian border)
  osm_relation_id: 9928151
distance_km: 1506
total_ascent_m: 27852
sleeping:
  type: mixed
  booking_ahead: recommended
  notes: Mountain huts, apartments, hostels and hotels. Many private rooms are only bookable by phone, often in Serbian; one hiker wild-camped a lot.
difficulty:
  level: 3
  reason: "Flat and easy in Vojvodina, but the eastern sections are rated 'demanding' (Veliko Gradište–Beljanica: 149.6 km, +6,565 m); some paths are overgrown."
logistics:
  getting_to_start: Trains serve Subotica, Novi Sad and Niš; buses are the most reliable option but there is no central bus operator.
  leaving_from_end: The E4 is not defined between Gradina and Sofia; the Sultans Trail can be followed from the border to Sofia instead.
  nearest_airports:
    - Belgrade Nikola Tesla (BEG)
    - Niš (INI)
flags:
  permit: free-registration
  permit_notes: No trail permit. Foreigners must register their stay with the police within 24 h; one hiker found this impractical when camping in remote places. The final stage runs close to the Bulgarian border, where border police may stop walkers.
  waymarked: partial
links:
  official_site: https://pss.rs/planinarski-objekti-i-tereni/tereni/?tip=evropski-pesacki-putevi-u-srbiji
establishment_signals:
  - "Official status: European long-distance path (ERA E-path), PSS sections E4-1 to E4-13"
  - "Official website: PSS register of European paths in Serbia"
  - "Guidebook: PSS booklet 'Kroz Srbiju peške lakim korakom' (English: 'Rambling through Serbia at a slow pace', 2011), covering E4 and E7"
  - Waymarked only in parts
trip_reports:
  - url: https://johnpone4serbia.blogspot.com
    title: John P's walk through Serbia on the E4
    year_hiked: 2018
    summary: "British solo walker: Vojvodina in Sept–Oct 2017, then Donji Milanovac to Dimitrovgrad in spring 2018 (days 35–59); few waymarks, much wild camping."
  - url: https://www.loc.wiki/hiking-trails/serbia-e4-long-distance-european-trail-from-veliko-gradiste-to-monsa-24579006
    title: "Serbia: E4 Long Distance European Trail from Veliko Gradiste to Monsa"
    year_hiked: 2018
    summary: Same walker's GPS track through the Homolje mountains, walked in March 2018; notes a 'No path' section.
  - url: https://www.wikiloc.com/hiking-trails/serbia-e4-long-distance-european-trail-from-jalovik-izvor-to-dmitrovgrad-25520300
    title: "Serbia: E4 Long Distance European Trail from Jalovik Izvor to Dmitrovgrad"
    year_hiked: 2018
    summary: Final Serbian stages over Babin Zub (Stara Planina), past Zavoj lake to Dimitrovgrad.
