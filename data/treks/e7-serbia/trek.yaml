id: e7-serbia
status: draft
name: European long-distance path E7 – Serbia (Evropski pešački put E7)
countries:
  - RS
region: Vojvodina, western and south-western Serbia, Kopaonik–Toplica and south-east Serbia
one_liner: "Serbia's longest walk: from the Hungarian border across Vojvodina, Tara, Zlatibor, Golija and Kopaonik to the North Macedonian border, with patchy waymarking."
route:
  type: point-to-point
  start: Bački Vinogradi (Hungarian border)
  end: Prohor Pčinjski monastery (North Macedonian border)
  osm_relation_id: 10325739
distance_km: 2113.3
sleeping:
  type: mixed
  notes: Mountain huts, private apartments and cabins, hostels and hotels; campsites mostly at popular sights.
difficulty:
  level: 3
  reason: "Very long, with mountain sections the PSS rates 'demanding' (e.g. Gradac–Kriva Reka: 123.5 km, +5,100 m) and stretches without waymarks."
logistics:
  getting_to_start: Trains serve Subotica, Novi Sad, Valjevo, Zlatibor and Niš; buses are the most reliable transport but there is no central bus operator.
  nearest_airports:
    - Belgrade Nikola Tesla (BEG)
flags:
  permit: free-registration
  permit_notes: No trail permit. Foreigners must register their stay with the police within 24 h; hotels and hostels do this, but when camping or staying privately you must do it yourself.
  waymarked: partial
links:
  official_site: https://era-ewv-ferp.org/e-paths/e7/e7-in-serbia
establishment_signals:
  - "Official status: European long-distance path (ERA E-path), managed by the Mountaineering Association of Serbia (PSS), split into numbered PSS sections E7-1 to E7-20"
  - "Official website: ERA country page and the PSS register of European paths"
  - "Guidebooks: 'Kroz Srbiju peške lakim korakom' (PSS, 2011) and 'Srbijom – korak po korak' (PSS, 2024)"
  - Waymarked only in parts (339 km re-marked in the Zlatibor district by the 2023–2025 E-CrossPass project; OSM notes it is mostly unmarked elsewhere)
trip_reports: []
