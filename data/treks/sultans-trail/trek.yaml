id: sultans-trail
status: draft
name: Sultans Trail
countries:
  - AT
  - SK
  - HU
  - HR
  - RS
  - BG
  - GR
  - TR
region: "Danube and Morava valleys to the Nišava gorge (Serbian section: about 780 km in 38 stages)"
one_liner: A cultural long-distance walk from Vienna to Istanbul; in Serbia it follows the Danube to Belgrade, then the Morava valley and the Nišava gorge to Bulgaria.
route:
  type: point-to-point
  start: Vienna (St. Stephen's Cathedral)
  end: Istanbul (tomb of Sultan Süleyman)
  osm_relation_id: 16127693
  gpx_source: https://sultanstrail.com/store/Hiking-Belgrade-Sofia-digital-information-package-p742683014
distance_km: 2500
typical_days:
  min: 140
  max: 175
sleeping:
  type: mixed
  notes: Towns, monasteries and guesthouses along the way; the paid digital information package lists accommodation. One solo hiker wild-camped most of the way.
difficulty:
  level: 1
  reason: Mostly river valleys and low hills; highest point in Serbia 534 m (Fruška Gora) or 1,170 m on the Suva Planina variant.
logistics:
  getting_to_start: Vienna has an international airport. The Serbian Section 4 starts at the Stambol Gate of Kalemegdan fortress in Belgrade, reachable by minibus A1 or bus 72 from Belgrade airport.
  leaving_from_end: Istanbul Airport is about 40 km north-west of the city, with Havaist shuttle buses.
  nearest_airports:
    - Vienna (VIE)
    - Belgrade Nikola Tesla (BEG)
    - Niš (INI)
    - Istanbul (IST)
flags:
  permit: free-registration
  permit_notes: No trail permit. In Serbia, foreigners must register their stay with the police within 24 h (accommodation does this for you). Serbia is not in the EU or the Schengen area.
links:
  official_site: https://sultanstrail.com/
establishment_signals:
  - "Official status: international long-distance trail run by the Sultans Trail Foundation, mapped in OSM as an international route (iwn)"
  - Official website with stage maps and an app
  - "Guidebooks: official digital information packages per section, plus Martin Zinggl's 2025 travel book"
  - "Regularly covered in trip reports and media (BBC 'Pilgrimage: The Road to Istanbul', 2020)"
trip_reports:
  - url: https://sultanstrail.com/hiking/jagna-through-the-balkans/
    title: “You are going to hike for three months? Through the Balkans?? ALONE???”
    summary: Solo woman, about three months from Vienna to Plovdiv on a sabbatical, mostly wild camping; took the bus from Belgrade to Niš.
  - url: https://sultanstrail.com/hiking/serbia-nis-to-bulgaria-pazardzhik/
    title: Travelogue from Serbia, Niš to Bulgaria, Pazardzhik
    summary: About two weeks from Niš airport into Bulgaria with a local guide; stayed in a mountain hotel and a monastery in Serbia.
  - url: https://sultanstrail.com/paddy/leaving-the-sultanstrail/
    title: Leaving the Sultanstrail
    summary: Paddy Devlin's blog from mid-walk, heading west from Niš across southern Serbia.
