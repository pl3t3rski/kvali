id: zentralalpenweg-02
status: published
name: Zentralalpenweg 02 (Austrian Long-Distance Trail 02)
countries:
  - AT
region: "Across Austria: Leitha hills, Niedere and Hohe Tauern, Zillertal/Ötztal Alps to Vorarlberg"
one_liner: Austria’s longest national trail, about 1,200 km along the Central Alps from Hainburg to Feldkirch, with a glacier-free 02A variant.
route:
  type: point-to-point
  start: Hainburg an der Donau
  end: Feldkirch
  osm_relation_id: 193073
  osm_section:
    from:
      - 48.1476
      - 16.9414
    to:
      - 47.2343
      - 9.5989
distance_km: 1200
typical_days:
  min: 64
  max: 73
when:
  best_months:
    - 7
    - 8
    - 9
  open_season: The high sections in the Schladminger and Radstädter Tauern are usually walkable, and their huts open, only from July to September
sleeping:
  type: mixed
  booking_ahead: recommended
  notes: Guesthouses in the east, where there are no club huts; huts in the high mountains.
difficulty:
  level: 4
  reason: Main alpine route 02 crosses glaciers and reaches ~3,400 m (Venediger group); needs glacier experience, sure-footedness, head for heights. 02A is glacier-free.
logistics:
  nearest_airports: []
  getting_to_start: Hainburg lies on the Danube between Vienna and Bratislava; public transport recommended.
flags:
  permit: none
  permit_notes: No permit; glacier sections are on the main alpine route only.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: true
links:
