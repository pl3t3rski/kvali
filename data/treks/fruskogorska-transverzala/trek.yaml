id: fruskogorska-transverzala
status: draft
name: Fruška Gora Transversal (Fruškogorska transverzala, T-1-9)
countries:
  - RS
region: Fruška Gora National Park, Vojvodina
one_liner: A 165 km loop of Fruška Gora's forested ridge and its monasteries, with eight mountain huts and springs along the way, an hour from Novi Sad.
route:
  type: loop
  start: Stražilovo (PD Stražilovo hut)
  end: Stražilovo (PD Stražilovo hut)
  osm_relation_id: 11510161
  gpx_source: https://pss.rs/wp-content/uploads/2020/12/T-1-9-FG_Transverzala.gpx
distance_km: 164.7
total_ascent_m: 5562
typical_days:
  min: 10
  max: 10
sleeping:
  type: mixed
  notes: Eight mountain huts (Stražilovo, Zanatlija, Orlovo gnezdo, Železničar, Dr Radivoj Simonović, Osovlje, Zmajevac, Vojvodina) plus hotels and private rooms in Vrdnik and Hotel Norcev at Iriški Venac.
difficulty:
  level: 1
  reason: Low wooded hills (highest point 539 m, Crveni čot); about 16 km and 550 m of climbing a day over 10 days.
logistics:
  getting_to_start: "It is a loop: control point 3 (PD Železničar at Popovica) is at the penultimate stop of Novi Sad city bus 74."
flags:
  permit: free-registration
  permit_notes: No trail permit; 32 control points with stamps. Foreigners must register their stay with the police within 24 h.
  waymarked: partial
  water_scarce: false
links:
  official_site: https://pss.rs/terenipp/fruskogorska-transverzala/
establishment_signals:
  - "Official status: PSS-registered transversal T-1-9, opened 1956, run by the Mountaineering Association of Vojvodina"
  - "Official website: PSS register page and Planinarski savez Vojvodine"
  - "Waymarked only in parts: red triangle marks, but 'several sections are not yet marked' (PSS)"
