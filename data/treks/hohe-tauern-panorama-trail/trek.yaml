id: hohe-tauern-panorama-trail
status: draft
name: Hohe Tauern Panorama Trail
countries:
  - AT
region: Hohe Tauern National Park holiday region (Pinzgau and Pongau, Salzburg)
one_liner: 17-stage walk along the north side of the Salzach valley from the Krimml Waterfalls to Hüttschlag, facing the Hohe Tauern peaks.
route:
  type: point-to-point
  start: Krimml (Krimml Waterfalls)
  end: Hüttschlag (Großarltal)
distance_km: 270
total_ascent_m: 13812
typical_days:
  min: 17
  max: 17
when:
  best_months:
    - 6
    - 7
    - 8
    - 9
sleeping:
  type: mixed
  notes: "Nights alternate between valley villages and mountain huts; official booking centre and luggage transfer. Not every stage has an inn or a water fountain, for example stages 5 and 7: carry enough water."
difficulty:
  level: 2
  reason: Rated intermediate; 4–8 h days between 1,500 and 2,400 m with no cable-secured sections; ~800 m ascent per day on average.
logistics:
  getting_to_start: Hourly buses run between Zell am See and Krimml.
  leaving_from_end: Public transport recommended to shorten parts of stages 12, 15 and 16.
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit; the national park has no entrance fee.
  water_scarce: false
  exposed_or_via_ferrata: false
  waymarked: yes
links:
  official_site: https://www.hohetauerntrail.at/de
establishment_signals:
  - official_status
  - official_site
  - trip_reports
trip_reports:
