id: gledicka-transverzala
status: draft
name: Gledić Mountains Transversal (Gledićka transverzala, T-2-31)
countries:
  - RS
region: Gledić mountains, Šumadija (central Serbia)
one_liner: A 101 km loop of the low, wooded Gledić hills linking six monasteries, including Kalenić, from a mountain hut at Adžine Livade.
route:
  type: loop
  start: PD "Dr Sonja Perišić" hut, Adžine Livade
  end: PD "Dr Sonja Perišić" hut, Adžine Livade
  osm_relation_id: 12433999
distance_km: 101
total_ascent_m: 3434
typical_days:
  min: 4
  max: 5
sleeping:
  notes: Starts and ends at the PD 'Dr Sonja Perišić' mountain hut; no other accommodation listed.
difficulty:
  level: 2
  reason: About 20–25 km and 700–850 m of climbing a day between 260 m and 922 m.
flags:
  permit: free-registration
  permit_notes: No trail permit; rules and a logbook from Žeželj PD (Kragujevac). Foreigners must register their stay with the police within 24 h.
  waymarked: yes
links:
  official_site: https://pss.rs/terenipp/gledicka-transverzala/
establishment_signals:
  - "Official status: PSS-registered transversal T-2-31 (opened 2007)"
  - Waymarked in both directions (last marked July–August 2012)
  - "Official website: PSS register page and club Žeželj PD (pdzezelj.org)"
