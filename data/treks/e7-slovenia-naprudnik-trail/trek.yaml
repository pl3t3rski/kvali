    title: 21.4.2015 Robič – Tolmin
    year_hiked: 2015
    summary: Two friends walk the trail in three-day sections; the first day from Robič is 42 km. On an earlier section fallen trees and poor waymarks cost them hours. In Slovenian
  - url: http://e7slovenija.blogspot.com/2007/06/europeen-long-distance-footpaths-e7.html
    title: Europeen Long Distance Footpaths – E7, Slovenia
    year_hiked: 2007
    summary: A five-day walk from Žužemberk over the Gorjanci and Kostanjevica to Podsreda and Olimje, with a night at a farm
