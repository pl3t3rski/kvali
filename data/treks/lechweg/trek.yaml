id: lechweg
status: published
name: Lechweg
countries:
  - AT
  - DE
region: Vorarlberg, Tyrolean Lech valley, Allgäu
one_liner: Follows the Lech from the Formarinsee to the Lechfall in Füssen, mostly on valley paths, with nights in village guesthouses.
route:
  type: point-to-point
  start: Formarinsee (Lech am Arlberg)
  end: Lechfall, Füssen (DE)
  osm_relation_id: 4728034
  osm_section:
    from:
      - 47.1713
      - 9.9994
    to:
      - 47.5619
      - 10.6953
distance_km: 125
total_ascent_m: 3021
typical_days:
  min: 7
  max: 10
when:
  best_months:
    - 6
    - 7
    - 8
    - 9
  open_season: The whole length is walkable only from mid or late June to early October; earlier, snow lies between the Formarinsee and Warth. From mid May you can start at Steeg
sleeping:
  type: guesthouses
  notes: Villages along the valley; luggage transport offered.
  booking_ahead: recommended
difficulty:
  level: 2
  reason: Mostly valley paths with small daily climbs; red (intermediate) mountain trails on the first stages from 1,871 m.
logistics:
  getting_to_start: Hiking bus 707 from the Dorfhus in Lech to the Formarinsee, mid June to early October.
  leaving_from_end: Bus 100 from Füssen to Reutte, then bus 110 to Lech; the last one leaves Füssen at about 2 pm.
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit. Wild camping is not allowed.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: false
