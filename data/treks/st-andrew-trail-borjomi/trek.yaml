id: st-andrew-trail-borjomi
status: published
name: St. Andrew Trail (Borjomi-Kharagauli National Park, trail 2)
countries:
  - GE
region: Borjomi-Kharagauli National Park, Lesser Caucasus
one_liner: The park's longest and hardest marked route, over Sametskhvario (2,642 m) from pine forest to Colchic rainforest.
route:
  type: point-to-point
  start: Atskuri guard station
  end: Marelisi guard station
  osm_relation_id: 3740333
  osm_section:
    from:
      - 41.748
      - 43.177
    to:
      - 41.948
      - 43.283
distance_km: 54
typical_days:
  min: 4
  max: 5
when:
  best_months:
    - May
    - June
    - July
    - August
    - September
    - October
  open_season: Summer and autumn (park)
sleeping:
  type: huts
  booking_ahead: recommended
  notes: "Amarati and Sakhvlari tourist shelters, Sametskhvario guard shelter, optional Kvazvinevi ranger shelter; tents allowed at these sites. Shelters are basic: carry a sleeping bag, food and a stove. Arrange places at the visitor centre when you register."
difficulty:
  level: 3
  reason: "Park rates it hard; long forest climbs to 2,642 m Sametskhvario; days up to 19 km. A bridge on the last day has been reported damaged: ask the visitor centre before you go"
logistics:
  getting_to_start: Atskuri guard station is 27 km from the Borjomi visitor centre; register in Borjomi first.
  leaving_from_end: Marelisi is hard to leave by marshrutka; the train may be an option.
  nearest_airports:
    - Tbilisi
    - Kutaisi
flags:
  permit: free-registration
  permit_notes: Register at the Borjomi or Kharagauli visitor centre before starting. The entry permit is free and rangers ask to see it. Shelters and campsites are paid.
  waymarked: true
  water_scarce: false
  exposed_or_via_ferrata: false
links:
  official_site: https://nationalparks.ge/en/site/borjomi-kharagaulinp/tripsInner/25
