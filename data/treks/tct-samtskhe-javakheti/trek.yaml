id: tct-samtskhe-javakheti
status: published
name: Transcaucasian Trail – Samtskhe-Javakheti (Gandzani – Borjomi)
countries:
  - GE
region: Javakheti plateau and Abul-Samsari range, Lesser Caucasus
one_liner: Volcanic plateau, crater lakes and shepherd camps on the TCT's newest Georgian stage, then down through forest to Borjomi.
route:
  type: point-to-point
  start: Gandzani
  end: Borjomi
  osm_relation_id: 19410123
  osm_section:
    from:
      - 41.3477
      - 43.7499
    to:
      - 41.8412
      - 43.3839
distance_km: 102
total_ascent_m: 3563
typical_days:
  min: 4
  max: 6
when:
  best_months:
    - July
    - August
    - September
  open_season: Main route over Samsari Pass typically July–September (snow can linger into July); lowland alternate via Lake Paravani roughly June–October; northern forest section May–November
sleeping:
  type: mixed
  notes: Wild camping required from Gandzani to Lake Tabatskuri (about half the route). Guesthouses in Gandzani, Tabatskuri and Borjomi.
difficulty:
  level: 3
  reason: Steep scree at 3,091 m Samsari Pass, boulder fields, open-terrain navigation; guardian dogs are the main hazard
logistics:
  getting_to_start: Daily marshrutka Tbilisi (Samgori) – Ninotsminda run by Family Corner Guesthouse in Gandzani, ~20 GEL, ~2.5 h; call ahead.
  leaving_from_end: Borjomi – Tbilisi marshrutkas roughly hourly (15 GEL, ~2.5 h) or early train; vans to Kutaisi.
  nearest_airports:
    - Tbilisi
    - Kutaisi
flags:
  permit: none
  permit_notes: "No permit mentioned for this stage. If you finish via Zanavi into Borjomi-Kharagauli NP (trail #4), park registration rules apply and wild camping is forbidden in the park."
  waymarked: partial
  water_scarce: true
  exposed_or_via_ferrata: false
links:
  official_site: https://transcaucasiantrail.org/en/hike/samtskhe-javakheti-georgia/
establishment_signals:
  - official_status
  - official_site
trip_reports:
  - url: https://teletype.in/@dvality/samsari
    title: Самсари трип (Samsari trip)
    year_hiked: 2023
    summary: Five friends take four days from Gandzani over Samsari Pass to Lake Tabatskuri in June, through snowfields, boulders, hail and shepherd dogs, and finish in Bakuriani. In Russian
  - url: https://mooseandbugs.com/the-transcaucasian-trail-part-ii-across-georgia-to-the-black-sea
    title: "Transcaucasian Trail Georgia: Day-by-Day Thru-Hike Journal"
    summary: Three thru-hikers walk north from Gandzani over Samsari Pass, down loose rock into windy meadows, and on through Bakuriani to Borjomi (days 37 to 41)
  - url: https://fromsunrisetosunset.com/thru-hiking-new-transcaucasian-trail-georgia/#diary
    title: Thru-hiking NEW Transcaucasian Trail Georgia
    year_hiked: 2022
    summary: Two hikers go south in October from Zanavi past Tabatskuri to Gandzani on the lower line by Lake Paravani, not over the pass, with dogs and bad weather on the way (days 32 to 36)
