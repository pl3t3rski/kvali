name: Bastion Transversal (Bastionska transverzala, T-4-41)
countries:
  - RS
region: Zaječar and Gamzigrad (Felix Romuliana), eastern Serbia
one_liner: A gentle three-day loop around Zaječar linking eight 19th-century hilltop bastions with the UNESCO Roman palace of Felix Romuliana.
route:
  type: loop
  start: Zaječar (sports hall, info board)
  end: Zaječar (sports hall, info board)
