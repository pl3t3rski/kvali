typical_days:
  min: 3
  max: 3
sleeping:
  type: guesthouses
  notes: Rehabilitation hospital at Gamzigradska Banja and village homestays in Gamzigrad, Nikoličevo and Gamzigradska Banja.
difficulty:
  level: 1
  reason: About 23 km and 535 m of climbing a day on low hills (116–432 m).
flags:
  permit: free-registration
  permit_notes: No trail permit; booklet (250 RSD) from OPSD Dragan Radosavljević; bring an ink pad for most stamps. Foreigners must register their stay with the police within 24 h.
