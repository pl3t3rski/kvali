    title: Tiroler Höhenweg Juli–Aug 2021
    year_hiked: 2021
    summary: "Two weeks from Finkenberg to Dorf Tirol: lightning near the Pfitscher Joch, nights in huts from the Landshuter Europahütte to the Schneeberghütte, and forecast snow sends them down to Pfelders. In German"
  - url: https://www.alpenverein.at/zillertal/berichte/bergsommer/2011_08_tiroler_hoehenweg.php
    title: Tiroler Höhenweg
    year_hiked: 2011
    summary: Six walkers go from the Schlegeis reservoir over the Pfitscher Joch and the Tribulaun huts towards Dorf Tirol; poor marking sends them over the wrong col and costs a day. In German
