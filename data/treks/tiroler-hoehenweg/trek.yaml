id: tiroler-hoehenweg
status: draft
name: Tiroler Höhenweg (Alta Via Tiroler Höhenweg)
countries:
  - AT
  - IT
region: Zillertal Alps / Stubai / Texel group (Tyrol to South Tyrol)
one_liner: Demanding 11–13-day high route from Mayrhofen across the main Alpine ridge to Merano, staying between 1,600 and 3,000 m.
route:
  type: point-to-point
  start: Mayrhofen (AT)
  end: Merano (IT)
distance_km: 160
total_ascent_m: 12000
typical_days:
  min: 11
  max: 14
when:
  best_months:
    - 7
    - 8
    - 9
sleeping:
  type: mixed
  notes: Huts, alms and village inns, among them the Landshuter Europahütte, Sattelbergalm, the Italian Tribulaun hut, Schneeberghütte, Zwickauer and Stettiner huts.
  booking_ahead: required
difficulty:
  level: 4
  reason: Graded T2 to T6, with cable-secured and partly exposed passages; not a first multi-day alpine trek
logistics:
  getting_to_start: Bus 4102 from Mayrhofen station to the Schlegeis reservoir, every 30 minutes from early July to mid September.
  leaving_from_end: Regular buses from Dorf Tirol to Meran, which has a railway station.
  nearest_airports:
    - Innsbruck
    - Bolzano
flags:
  water_scarce: false
  exposed_or_via_ferrata: true
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages.
  waymarked: yes
links:
  official_site: https://www.tyrol.com/activities/sport/hiking/hiking-tours/tiroler-hoehenweg-2-bis-4-etappe
establishment_signals:
