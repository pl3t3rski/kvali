id: koasa-trail
status: draft
name: Koasa Trail
countries:
  - AT
region: Wilder Kaiser / Region St. Johann in Tirol
one_liner: Five-day near-loop from St. Johann in Tirol along the eastern Wilder Kaiser and nearby alms; nights in inns, optional luggage transfer.
route:
  type: loop
  start: St. Johann in Tirol
  end: Wiesenschwang (Oberndorf in Tirol)
distance_km: 83
total_ascent_m: 4700
typical_days:
  min: 5
  max: 6
when:
  best_months:
    - 6
    - 7
    - 8
    - 9
    - 10
  open_season: Snowfields can lie on the higher stages in mid June
sleeping:
  type: mixed
  notes: Valley lodging plus alms (e.g. Fischbachalm); 6-night packages and optional luggage transfer.
  booking_ahead: recommended
difficulty:
  level: 2
  reason: "Moderate: fitness 5 of 6, technique 3 of 6; stage 2 crosses rocky, partly exposed ground below the Stripsenjoch"
logistics:
  getting_to_start: St. Johann in Tirol (Infobüro); Okto hiking bus in the region.
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages.
  water_scarce: false
  exposed_or_via_ferrata: false
  waymarked: partial
