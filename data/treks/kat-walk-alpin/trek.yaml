id: kat-walk-alpin
status: draft
name: KAT Walk Alpin (Kitzbüheler Alpen Trail)
countries:
  - AT
region: Kitzbühel Alps, Tyrol
one_liner: Six-day inn-to-inn walk across the grassy Kitzbühel Alps from Hopfgarten via Kitzbühel and the Kitzbüheler Horn to St. Ulrich am Pillersee.
route:
  type: point-to-point
  start: Hopfgarten im Brixental
  end: St. Ulrich am Pillersee
distance_km: 113
total_ascent_m: 6350
typical_days:
  min: 6
  max: 6
when:
  best_months:
    - 6
    - 7
    - 8
    - 9
sleeping:
  type: guesthouses
  notes: Valley accommodation, packages with luggage transport.
difficulty:
  level: 2
  reason: Red (intermediate) mountain paths, ~1,000 m per day; no climbing, one short rope-secured passage on the Kitzbüheler Horn.
logistics:
  getting_to_start: Hopfgarten im Brixental Berglift station, 5 min walk to start; guest card gives free local transport.
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: true
