region: Kitzbühel Alps, Tyrol
one_liner: Six days over the soft grassy Kitzbühel Alps from Hopfgarten via Kitzbühel and the Kitzbüheler Horn to St. Ulrich am Pillersee; inn-to-inn, bookable without luggage.
