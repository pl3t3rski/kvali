trip_reports:
  - url: https://www.moonhoneytravel.com/europe/austria/eagle-walk-lechtal-alps/
    title: "Eagle Walk Lechtal Alps: Our Complete Hiking Guide"
    summary: Hiked stages 19–24 across the Lechtal Alps; found it far harder than expected but the most spectacular trail they had hiked in Austria.
  - url: https://fastestknowntime.com/fkt/philipp-ausserhofer-adlerweg-eagle-walk-2026-10-01
    title: "FKT: Philipp Ausserhofer – Adlerweg"
    year_hiked: 2026
    summary: Supported speed attempt starting 27 Sept 2026 in St. Johann; finished in 4 d 1 h 50 min – a running report, not a typical hike.
  - url: https://www.ernstjetzt.com/blog/adlerweg
    title: TEIL 1 Der Adlerweg Weitwandern in Tirol
    summary: "Stages 1 to 15 from St. Johann to Leutasch with a rest day in Innsbruck: a swim in the Hintersteiner See, the Karwendel with another walker and hail near the Falkenhütte. In German"
  - url: https://www.berginsel.de/trekking-adlerweg-in-tirol-mit-hund/
    title: "Trekking: Adlerweg in Tirol mit Hund"
    year_hiked: 2019
    summary: "Three trips with her dog, mostly camping: the Lechtal Alps in snow in 2017, Kufstein towards the Achensee in 2018 and the Kaiser mountains in 2019. In German"
