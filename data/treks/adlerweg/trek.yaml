id: adlerweg
status: draft
name: Adlerweg (Eagle Walk)
countries:
  - AT
region: Tyrol and East Tyrol (Kaisergebirge to Arlberg; Glockner and Venediger groups)
one_liner: Tyrol’s long-distance trail from St. Johann to the Arlberg in 24 stages, plus a separate 9-stage East Tyrol section; huts and inns.
route:
  type: point-to-point
  start: St. Johann in Tirol
  end: Arlbergpass (St. Christoph am Arlberg)
  osm_relation_id: 3305327
distance_km: 426
total_ascent_m: 28463
typical_days:
  min: 24
  max: 33
when:
  best_months:
    - 6
    - 7
    - 8
    - 9
  open_season: Huts on the route open from early or mid June to late September or early October
sleeping:
  type: mixed
  notes: Stages end at Alpine Club huts and valley inns (e.g. Gaudeamushütte, Gasthof Buchacker, Lucknerhaus).
  booking_ahead: recommended
difficulty:
  level: 3
  reason: Long alpine stages; tirol.at rates it 'schwierig' and says many (black) stages need alpine experience, sure-footedness and a head for heights; Cicerone gives easier alternatives.
logistics:
  getting_to_start: St. Johann in Tirol is the official start (stage 1 to the Gaudeamushütte).
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: true
links:
  official_site: https://www.tirol.at/aktivitaeten/sport/wandern/wandertouren/adlerweg-gesamtverlauf
