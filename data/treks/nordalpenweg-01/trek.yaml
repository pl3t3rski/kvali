    title: Nordalpenweg, der österreichische Weitwanderweg 01
    summary: Nearly 1,000 km in 55 daily stages. He leaves the 01 at the Memminger Hütte, walks the E5 through the Allgäu and rejoins at Alberschwende. In German
    year_hiked: 2013
  - url: https://weitwanderin.de/category/reise-tagebuch/quer-durch-oesterreich-nordalpenweg-2021/
    title: Quer durch Österreich & Nordalpenweg 2021
    year_hiked: 2021
    summary: An 81-day diary from Austria’s easternmost to its westernmost point, finishing on the Nordalpenweg into Bregenz, with storms, closures and detours. In German
