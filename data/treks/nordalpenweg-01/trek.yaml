id: nordalpenweg-01
status: published
name: Nordalpenweg 01 (Austrian Long-Distance Trail 01)
countries:
  - AT
region: Northern Limestone Alps, Burgenland/Vienna to Lake Constance
one_liner: Opened in 1975, about 1,000 km through the Northern Limestone Alps from Vienna or Lake Neusiedl to Bregenz on Lake Constance.
route:
  type: point-to-point
  start: Rust am Neusiedler See (01A) or Perchtoldsdorf near Vienna
  end: Bregenz (Lake Constance)
  osm_relation_id: 177745
  osm_section:
    from:
      - 48.1193
      - 16.2635
    to:
      - 47.5035
      - 9.7395
distance_km: 1000
typical_days:
  min: 49
  max: 61
when:
  best_months:
    - 7
    - 8
    - 9
  open_season: The hardest stages can be walked without high-alpine gear only from July to September
sleeping:
  type: mixed
  booking_ahead: recommended
difficulty:
  level: 4
  reason: Largely high-alpine up to ~3,000 m (Zugspitze variant); alpine gear, sure-footedness and route-finding needed; one avoidable via ferrata (Zahme Gamseck).
logistics:
  nearest_airports: []
  getting_to_start: The trail starts at the long-distance stone in Perchtoldsdorf near Vienna (or in Rust for route 01A); public transport recommended.
  leaving_from_end: Ends on the lake shore in Bregenz, by the railway station.
flags:
  permit: none
  permit_notes: No permit.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: true
links:
