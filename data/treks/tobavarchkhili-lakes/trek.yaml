    title: Our trek to Tobavarchkhili lake
    year_hiked: 2019
    summary: Four Belgian friends, 5 days from Mukhuri by the classic trail; cab to Natipuru hut, camped at Okhoje lake.
  - url: https://vaclavparis.wordpress.com/2023/08/09/the-georgian-caucasus/
    title: The Georgian Caucasus
    year_hiked: 2023
    summary: A fast solo crossing from Skuri over Okare Pass to the lake, then over two more passes in rain and mist and down to Khaishi on the third morning
  - url: https://www.sipurderech.co.il/%D7%92%D7%90%D7%95%D7%A8%D7%92%D7%99%D7%94/%D7%98%D7%A8%D7%A7-tobavarchkhili
    title: Tobavarchkhili trek – Silver lake trek
    year_hiked: 2017
    summary: A couple takes five days from Mukhuri past Okhoje lake and Tobavarchkhili to Khaishi, with hard route-finding and river crossings. In Hebrew
