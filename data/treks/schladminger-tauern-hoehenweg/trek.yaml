id: schladminger-tauern-hoehenweg
status: published
name: Schladminger Tauern Höhenweg
countries:
  - AT
region: Schladminger Tauern, Niedere Tauern (Styria)
one_liner: Hut route among the lakes of the Schladminger Tauern, through the Klafferkessel; five or seven stages, partly on the Zentralalpenweg 02.
route:
  type: point-to-point
  start: Hochwurzen top station (Schladming)
  end: Seewigtal (Bodensee car park)
  osm_relation_id:
