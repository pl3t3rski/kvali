distance_km: 45
total_ascent_m: 4115
typical_days:
  min: 5
  max: 7
when:
  best_months:
    - 7
    - 8
    - 9
  open_season: The official package runs from July to mid September
sleeping:
  type: huts
  booking_ahead: required
  notes: Huts often booked out months ahead; each hut is booked separately.
difficulty:
  level: 3
  reason: Alpine experience needed on all stages (fitness 6/6, technique 5/6); high point Greifenberg 2,618 m; cable-protected variant 702A.
logistics:
  getting_to_start: Train to Schladming, bus to the Hochwurzen gondola, then up by gondola. Multi-day walkers park free at Planai West, not at the gondola.
  leaving_from_end: Bus 976 from the Seewigtal car park back to Schladming.
