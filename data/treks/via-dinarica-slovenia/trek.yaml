trip_reports:
  - url: https://thetrek.co/via-dinarica-first-week/
    title: Via Dinarica!??! First Week!!!
    year_hiked: 2022
    summary: A thru-hiker walks from Razdrto via Predjama, Rakov Škocjan and Cerknica to Bloke in seven days, loses his pot in a cistern, misses a turn marked only by rock blazes and camps wild
  - url: https://viadinarica.com/en/blog-2/126-stage-1-postojna-prezid
    title: "Stage 1: Postojna – Prezid"
    year_hiked: 2016
    summary: Walking Postojna to Mašun, over Snežnik and on to Babno polje and Prezid; the inn at Mašun is full, so she camps in its garden and sees a bear
