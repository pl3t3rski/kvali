id: via-dinarica-slovenia
status: published
name: Via Dinarica Slovenia
countries:
  - SI
region: Notranjska and the Green Karst (Nanos to Snežnik)
one_liner: First section of the Via Dinarica, crossing Slovenia's karst plateaus and lakes from Mt Nanos to the Croatian border.
route:
  type: point-to-point
  start: Razdrto, below Nanos
  end: Babno polje (Croatian border)
  osm_relation_id: 20973970
  osm_section:
    from:
      - 45.7568
      - 14.0604
    to:
      - 45.6459
      - 14.5609
distance_km: 159
typical_days:
  min: 7
  max: 10
when:
  best_months:
    - April
    - May
    - June
    - July
    - August
    - September
    - October
sleeping:
  type: mixed
  booking_ahead: recommended
  notes: Mountain huts (Koča Mladika, Sviščaki, the hut on Snežnik), the Proteus youth hostel in Postojna, a hotel at Rakov Škocjan and inns. The first stage of the Via Dinarica White Trail.
difficulty:
  level: 2
  reason: Easy to medium overall, with two harder climbs (to 1,313 m and 1,796 m).
logistics:
  getting_to_start: Postojna has frequent buses and trains; buses from Ljubljana stop at Razdrto.
  nearest_airports:
    - Ljubljana
flags:
  permit: none
  exposed_or_via_ferrata: false
  waymarked: partial
  water_scarce: false
  permit_notes: No permit is mentioned by the trail’s own pages.
