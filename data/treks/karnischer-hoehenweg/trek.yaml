id: karnischer-hoehenweg
status: published
name: Karnischer Höhenweg (Carnic Peace Trail, KHW 403)
countries:
  - AT
  - IT
region: Carnic Alps (East Tyrol and Carinthia, on the Italian border)
one_liner: Ridge-line hut trek along the Austro-Italian border through WWI front-line relics; exposed in the west, gentle east of the Plöckenpass.
route:
  type: point-to-point
  start: Sillian (East Tyrol)
  end: Thörl-Maglern / Arnoldstein (Carinthia)
  osm_relation_id: 1163255
  osm_section:
    from:
      - 46.7163
      - 12.3618
    to:
      - 46.5425
      - 13.6509
distance_km: 156
total_ascent_m: 9499
typical_days:
  min: 8
  max: 11
when:
  best_months:
    - 6
    - 7
    - 8
    - 9
  open_season: Walkable mid-July to end of September depending on snow
sleeping:
  type: huts
  notes: "11 huts and rifugi along the ridge; daily descent to valleys possible. The huts are very often full: booking is binding, at least a day ahead, and some take online bookings only, with a deposit."
  booking_ahead: required
difficulty:
  level: 3
  reason: "Moderate overall: long ridge days on mountain paths with short secured sections and some risk of falling; sure-footedness needed"
logistics:
  getting_to_start: Train via Lienz to Sillian, then hut taxi or walk up to the Leckfeldalm.
  leaving_from_end: Bus back through the Gail and Lesach valleys, or bus to Arnoldstein and train via Lienz.
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: true
links:
  official_site: https://www.osttirol.com/en/active-outdoor/hiking/long-distance-hiking-trails/the-karnische-hoehenweg-trail
