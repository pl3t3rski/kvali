name: Vlasina Transversal (Vlasinska transverzala, T-7-38)
countries:
  - RS
region: Čemernik and Vlasina, south-east Serbia
one_liner: A steep four-day climb from Vlasotince over Čemernik towards Vlasina Lake, past remains of the Roman Via Militaris.
