  min: 4
  max: 4
sleeping:
  type: guesthouses
  notes: Hotels and apartments at Vlasina Lake.
difficulty:
  level: 3
  reason: About 1,250 m of climbing a day on average (5,004 m over 4 days).
flags:
  permit: free-registration
  permit_notes: No trail permit; booklet from PD Čemernik in Vlasotince. Foreigners must register their stay with the police within 24 h.
