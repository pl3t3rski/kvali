id: e6-slovenia-ciglar-trail
status: draft
name: European long-distance path E6 – Slovenia (Ciglarjeva pot)
countries:
  - SI
region: Pohorje, Posavje Hills, Dinaric Karst, Slovenian coast
one_liner: Slovenian leg of the Baltic-Adriatic E-path, crossing the country north to south through forests and hills to the sea at Strunjan.
route:
  type: point-to-point
  start: Radlje ob Dravi (Radelj border crossing)
  end: Strunjan
  osm_relation_id: 1191538
  osm_section:
    from:
      - 46.6451
      - 15.2065
    to:
      - 45.528
      - 13.604
distance_km: 350
typical_days:
  min: 14
  max: 20
when:
  open_season: Walkable all year except on Pohorje and around Snežnik, where snow lies in winter
difficulty:
  level: 2
  reason: Rated easy to medium; mostly hills and forest.
logistics:
  getting_to_start: The trail starts at the Radelj border crossing above Radlje ob Dravi. Buses reach every larger village, trains the bigger towns.
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages. Optional stamps; the badge is sent by post.
  waymarked: yes
  exposed_or_via_ferrata: false
  water_scarce: false
links:
  official_site: https://eupoti.com/e6.htm
establishment_signals:
  - official status (European long-distance path E6)
  - waymarked along the whole route
  - official website (ERA / KEUPS)
  - published guidebook (Cortese - Evropska pešpot E6)
trip_reports:
  - url: https://gipfelrast.at/2022/09/e6slo-marezige-strunjan/
    title: "Tag 24: Finale #ammeer"
    year_hiked: 2022
    summary: Two walkers from Graz cover the Slovenian E6 in July and September, sleeping in huts, inns and a farm; they meet a bear near Snežnik and collect the last stamps at Pomjan and Strunjan. In German
  - url: https://e6radljestrunjan.wordpress.com/2009/08/02/99-namesto-konca/
    title: 99 Namesto konca
    year_hiked: 2009
    summary: Walking alone and without a tent, he goes from the Radelj crossing to Strunjan in eight days, in a bed every night, and warns about faded and hidden waymarks. In Slovenian
