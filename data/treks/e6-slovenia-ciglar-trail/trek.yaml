sleeping:
  type: mixed
  booking_ahead: recommended
  notes: Huts, inns, farms and private rooms, one at each of the 14 stage ends. Several inns have closed since 2023 and some huts open only at weekends. The trail now continues past Strunjan to the Croatian border at Sečovlje.
