id: nikoloz-romanov-trail
status: published
name: Nikoloz Romanov's Trail (Borjomi-Kharagauli National Park, trail 1)
countries:
  - GE
region: Borjomi-Kharagauli National Park, Lesser Caucasus
one_liner: Shelter-to-shelter crossing of a big forested national park via Lomismta, with Caucasus views on clear days.
route:
  type: point-to-point
  start: Likani guard station (near Borjomi)
  end: Marelisi guard station (near Kharagauli)
  osm_relation_id: 3740297
  osm_section:
    from:
      - 41.837
      - 43.336
    to:
      - 41.948
      - 43.283
distance_km: 43
typical_days:
  min: 3
  max: 3
when:
  best_months:
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
  open_season: Park lists the trail for all seasons. Most park trails are accessible from May to October or November; rhododendrons flower in May and June
sleeping:
  type: huts
  booking_ahead: recommended
  notes: "Lomismta and Sakhvlari tourist shelters, or tents. Shelters are basic: carry a sleeping bag, food and a stove. Arrange places at the visitor centre when you register."
difficulty:
  level: 2
  reason: "Forest climb from 930 m to Lomismta (2,198 m); 15–18 km days; park rates it medium. The last day follows a river where walkers report broken bridges and wading: ask the visitor centre before you go"
logistics:
  getting_to_start: Likani guard station is 5 km from the park visitor centre in Borjomi (Borjomi has trains and marshrutkas from Tbilisi).
  leaving_from_end: Marelisi is hard to leave by marshrutka; the train may be an option.
  nearest_airports:
    - Tbilisi
    - Kutaisi
flags:
  permit: free-registration
  permit_notes: Register at the Borjomi or Kharagauli visitor centre before starting. The entry permit is free and rangers ask to see it. Shelters and campsites are paid. Camping outside the marked sites is not allowed.
  waymarked: true
  water_scarce: false
  exposed_or_via_ferrata: false
links:
  official_site: https://nationalparks.ge/en/site/borjomi-kharagaulinp/tripsInner/3
