trip_reports:
  - url: https://evgeniy-taganay.livejournal.com/7083.html
    title: Национальный парк Боржоми-Харагаули (Borjomi-Kharagauli National Park)
    summary: A solo walker takes route 1 from Likani, spends an extra day climbing Lomi from the first shelter, then walks out down the gorge to Marelisi, about 55 km with the walk to the railway. Walked in September, posted in 2014. In Russian
  - url: https://travel.rbc.ua/rus/show/nestandartnaya-gruziya-vpechatlyayushchiy-1631272380.html
    title: Нестандартная Грузия (Georgia off the usual track)
    summary: Two walkers do the trail in three days and meet no other hikers. They lose the path on day two and reach the second shelter after dark, then wade the river nine times on the last day because the bridges are bare iron frames. Published in September 2021. In Russian
