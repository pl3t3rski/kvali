id: koroska-mountain-trail
status: published
name: Koroška Mountain Trail (Koroška planinska pot)
countries:
  - SI
region: Koroška (Karavanke, Pohorje, Kozjak, Savinja Alps edges)
one_liner: Circular stamp trail around the Mežica, Drava and Mislinja valleys with 31 checkpoints.
route:
  type: loop
  start: Ravne na Koroškem
  end: Ravne na Koroškem
  osm_relation_id: 121642
  osm_section:
    from:
      - 46.5423
      - 14.9682
    via:
      - - 46.5829
        - 15.4003
      - - 46.4203
        - 14.8718
    to:
      - 46.5423
      - 14.9682
distance_km: 230
typical_days:
  min: 10
  max: 12
when:
  best_months:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 11
  open_season: "The trail listing marks March to November. Huts on the high section open mainly in summer: Koča na Loki below Raduha opens June to August"
sleeping:
  type: mixed
  booking_ahead: recommended
  notes: "Mountain huts on the high sections (Pohorje, Uršlja gora, Smrekovec, Raduha, Peca) and inns in the valleys. Some huts open only in summer or at weekends: check before you go."
difficulty:
  level: 3
  reason: Long hut-to-hut days over Peca (2,125 m) and Raduha (2,062 m); much road walking between the high sections. The Alpine Association rates it very demanding
logistics:
  getting_to_start: Regular buses from Ljubljana to Ravne na Koroškem; parking behind the bus station.
  nearest_airports:
    - Ljubljana
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages. The optional stamp diary has 31 checkpoints.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: false
establishment_signals:
  - official status (regional trail of the Alpine Association of Slovenia)
trip_reports:
  - url: https://www.hribi.net/trenutne_razmere/slo/koroska_planinska_pot/10001/2630/2
    title: Koroško planinsko pot sem prehodil v enem zamahu (forum post, 16 June 2013)
    year_hiked: 2013
    summary: "One walker does the whole loop clockwise from Uršlja gora in a single push: 67 hours over three nights without sleep, about 220 km. He found the path below the hunting lodge to Žohar poor and the road sections long. In Slovenian"
  - url: https://www.hribi.net/trenutne_razmere/slo/koroska_planinska_pot/10001/2630/2
    title: Čudoviti trije dnevi pohajanja (forum post, 17 September 2020)
    year_hiked: 2020
    summary: Three days from Ožbalt over Ribniška koča, Kope and Uršlja gora to Smrekovec and Črna, sleeping in huts, about 90 km. The Ožbalt stamp has moved to the village shop. In Slovenian
