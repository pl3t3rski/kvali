  - trip_reports
trip_reports:
  - url: https://kray-zemli.com/127-v-svanetiyu-iz-rachi-peshkom-cherez-gory.html
    title: Пеший поход через горы из Рачи в Сванетию (On foot over the mountains from Racha to Svaneti)
    year_hiked: 2017
    summary: A group walks it the other way, from Ghebi over Vatsistsveri Pass, descends the wrong side, loses the trail in the Tskhenistskali valley and reaches Zeskho over Lapuri Pass after calling for help. In Russian
  - url: https://t.me/fa_huu/5628
    title: День 1. Тбилиси → деревня Теврешо (Рача) → Брили (a four-day series)
    year_hiked: 2026
    summary: Four daily posts from a group that starts above Ghebi in heavy rain, pushes through scrub to Sasvano lake and crosses both passes; on Lapuri Pass the fixed rope was gone and they climbed down without it. In Russian
