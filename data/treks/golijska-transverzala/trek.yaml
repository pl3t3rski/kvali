id: golijska-transverzala
status: draft
name: Golija Transversal (Golijska transverzala, T-5-4)
countries:
  - RS
region: Stolovi, Čemerno, Radočelo and Golija, south-west Serbia
one_liner: Five days from Žiča monastery over Stolovi, past Maglič fortress and Studenica monastery, up to Jankov Kamen (1,833 m) on Golija.
route:
  type: point-to-point
  start: Žiča monastery (near Kraljevo)
  end: Duga Poljana (Golija)
  osm_relation_id: 13236066
distance_km: 129.7
total_ascent_m: 5377
typical_days:
  min: 5
  max: 5
difficulty:
  level: 2
  reason: About 26 km and 1,075 m of climbing a day; the first day climbs from 226 m at Žiča to 1,375 m at Usovica.
flags:
  permit: free-registration
  permit_notes: No trail permit; stamp booklet (dnevnik) from the club. Foreigners must register their stay with the police within 24 h.
  waymarked: yes
links:
  official_site: https://pss.rs/terenipp/golijska-transverzala/
