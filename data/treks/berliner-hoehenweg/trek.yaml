id: berliner-hoehenweg
status: published
name: Berliner Höhenweg (Zillertaler Runde)
countries:
  - AT
region: Zillertal Alps, Tyrol
one_liner: High, glacier-flanked hut traverse of the Zillertal Alps over the 3,133 m Schönbichler Horn; steep and exposed in places, about a week.
route:
  type: point-to-point
  start: Finkenberg (Gamshütte)
  end: Mayrhofen (Karl-von-Edel-Hütte)
  osm_relation_id: 240736
  osm_section:
    from:
      - 47.1539
      - 11.8245
    to:
      - 47.1697
      - 11.8629
distance_km: 71
total_ascent_m: 6660
typical_days:
  min: 7
  max: 9
when:
  best_months:
    - 7
    - 8
    - 9
  open_season: Most huts open in mid June and close around 20 September
sleeping:
  type: huts
  notes: Eight Alpine Club huts; descent to the valley from every hut.
  booking_ahead: recommended
difficulty:
  level: 4
  reason: "Difficult: up to 3,133 m on the Schönbichler Horn, with several cable-secured and scrambling passages"
logistics:
  getting_to_start: Bus 4104 to Teufelsbrücke (Finkenberg); bus 8327 to the Ahornbahn in Mayrhofen. Every hut has a way down to the valley.
  leaving_from_end: Descend from the Karl-von-Edel-Hütte to Mayrhofen; valley villages are linked by public transport.
  nearest_airports: []
flags:
  permit: none
  permit_notes: No permit is mentioned by the trail’s own pages.
  waymarked: yes
  water_scarce: false
  exposed_or_via_ferrata: true
