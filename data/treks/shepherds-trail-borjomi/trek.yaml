id: shepherds-trail-borjomi
status: draft
name: Shepherds' Trail (Borjomi-Kharagauli National Park, trail 9)
countries:
  - GE
region: Borjomi-Kharagauli National Park, Lesser Caucasus
one_liner: Links the Romanov and St. Andrew trails over Lomismta and the Amarati ridge, past summer shepherd cabins.
route:
  type: point-to-point
  start: Likani guard station
  end: Atskuri guard station
  osm_relation_id:
    - 3740297
    - 3740346
    - 3740333
  osm_section:
    from:
      - 41.837
      - 43.336
    to:
      - 41.748
      - 43.177
distance_km: 51
typical_days:
  min: 3
  max: 3
when:
  open_season: Summer and autumn (park)
sleeping:
  type: huts
  booking_ahead: recommended
  notes: "Two overnights: Lomismta shelter (1,800 m, campsite too) and Amarati shelter, or tents at both. Shelters are basic: carry a sleeping bag, food and a stove. Arrange places at the visitor centre when you register."
difficulty:
  level: 3
  reason: Park rates it hard; day 2 is 20 km with climbs at both ends
logistics:
  getting_to_start: Likani guard station is 5 km from the Borjomi visitor centre.
  leaving_from_end: From Atskuri, catch a ride or a local marshrutka to Borjomi.
  nearest_airports:
    - Tbilisi
    - Kutaisi
flags:
  permit: free-registration
  permit_notes: Register at the Borjomi or Kharagauli visitor centre before starting. The entry permit is free and rangers ask to see it. Shelters and campsites are paid.
  waymarked: true
  water_scarce: false
  exposed_or_via_ferrata: false
